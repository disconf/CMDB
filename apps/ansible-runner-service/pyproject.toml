[project]
name = "cmdb-ansible-runner-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.116.1", "uvicorn[standard]==0.35.0", "pydantic-settings==2.10.1", "httpx==0.28.1", "ansible-runner==2.4.1", "ansible-core==2.18.7", "boto3==1.40.1"]
[project.optional-dependencies]
test = ["pytest==8.4.1", "pytest-asyncio==1.1.0"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
