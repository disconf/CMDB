name: ${COMPOSE_PROJECT_NAME:-cmdb-core}

services:
  postgres:
    build:
      context: ./postgres
    image: cmdb/postgres:17.10
    container_name: cmdb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_ADMIN_DB:?POSTGRES_ADMIN_DB is required}
      # Use a child directory so initdb does not need to chmod the volume mount point itself.
      PGDATA: /var/lib/postgresql/data/pgdata
      PLATFORM_DB_NAME: ${PLATFORM_DB_NAME:?PLATFORM_DB_NAME is required}
      PLATFORM_DB_USER: ${PLATFORM_DB_USER:?PLATFORM_DB_USER is required}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?PLATFORM_DB_PASSWORD is required}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:?KEYCLOAK_DB_NAME is required}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:?KEYCLOAK_DB_USER is required}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      # PostgreSQL WAL requires a local filesystem with POSIX ownership/fsync semantics.
      - ${POSTGRES_DATA_DIR:?POSTGRES_DATA_DIR is required}:/var/lib/postgresql/data
    tmpfs:
      # The Debian-based official image runs postgres as uid/gid 999.
      - /var/run/postgresql:rw,mode=3775,uid=999,gid=999
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [core]
    shm_size: 256mb

  redis:
    build:
      context: ./redis
    image: cmdb/redis:8.2
    container_name: cmdb-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH='$${REDIS_PASSWORD}' redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    networks: [core]
    security_opt: ["no-new-privileges:true"]

  kafka:
    build:
      context: ./kafka
    image: cmdb/kafka:4.3.1
    container_name: cmdb-kafka
    restart: unless-stopped
    environment:
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://${SERVER_HOST}:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks: [core]
    security_opt: ["no-new-privileges:true"]

  kafka-init:
    image: cmdb/kafka:4.3.1
    container_name: cmdb-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - |
        for topic in \
          cmdb.asset.changed.v1 \
          cmdb.relation.changed.v1 \
          discovery.resource.found.v1 \
          monitor.target.changed.v1 \
          alert.state.changed.v1 \
          job.execution.changed.v1 \
          ticket.state.changed.v1 \
          release.state.changed.v1 \
          audit.operation.created.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
            --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done
    networks: [core]
    restart: "no"

  keycloak:
    build:
      context: ./keycloak
    image: cmdb/keycloak:26.7.0
    container_name: cmdb-keycloak
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - start
      - --optimized
      - --http-enabled=true
      - --hostname-strict=false
      - --proxy-headers=xforwarded
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:?KEYCLOAK_HOSTNAME is required}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD is required}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8081:8080"
      - "127.0.0.1:9000:9000"
    networks: [core]
    security_opt: ["no-new-privileges:true"]

networks:
  core:
    name: cmdb-core

volumes:
  redis-data:
    name: cmdb-redis-data
  kafka-data:
    name: cmdb-kafka-data
