apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: license-center-data
  namespace: ops-qa
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: license-center
  namespace: ops-qa
  labels:
    app: cmdb-license-center
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: cmdb-license-center
  template:
    metadata:
      labels:
        app: cmdb-license-center
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: cmdb-registry
      containers:
        - name: license-center
          image: harbor.qa.bcavt.com/cmdb/gateway-bff:license-center-1.0.0
          command:
            - /license-center
          imagePullPolicy: IfNotPresent
          env:
            - name: HTTP_ADDR
              value: ":8090"
            - name: LICENSE_CENTER_DATA_FILE
              value: /data/licenses.json
            - name: LICENSE_CENTER_ISSUER
              value: CMDB Licensing Authority
            - name: LICENSE_SIGNING_KEY_FILE
              value: /run/secrets/license-signing-key
          envFrom:
            - secretRef:
                name: license-center-env
          ports:
            - name: http
              containerPort: 8090
          volumeMounts:
            - name: data
              mountPath: /data
            - name: signing-key
              mountPath: /run/secrets/license-signing-key
              subPath: license-signing-key
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 20m
              memory: 24Mi
            limits:
              cpu: 300m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: license-center-data
        - name: signing-key
          secret:
            secretName: license-center-signing
---
apiVersion: v1
kind: Service
metadata:
  name: license-center
  namespace: ops-qa
spec:
  type: NodePort
  selector:
    app: cmdb-license-center
  ports:
    - name: http
      port: 8090
      targetPort: http
      nodePort: 30081
