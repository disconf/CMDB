apiVersion: v1
kind: ConfigMap
metadata: {name: loki-config, namespace: ops-qa}
data:
  loki.yaml: |
    auth_enabled: false
    analytics: {reporting_enabled: false}
    server: {http_listen_port: 3100, grpc_listen_port: 9096, log_level: info}
    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem: {chunks_directory: /loki/chunks, rules_directory: /loki/rules}
      replication_factor: 1
      ring: {kvstore: {store: inmemory}}
    schema_config:
      configs:
        - from: 2024-04-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index: {prefix: index_, period: 24h}
    storage_config:
      tsdb_shipper: {active_index_directory: /loki/tsdb-index, cache_location: /loki/tsdb-cache}
      filesystem: {directory: /loki/chunks}
    limits_config:
      retention_period: 168h
      allow_structured_metadata: true
      volume_enabled: true
      max_query_series: 500
    compactor:
      working_directory: /loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      delete_request_store: filesystem
    ruler:
      storage: {type: local, local: {directory: /loki/rules}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: ops-qa
  labels: {app: loki, tier: observability}
spec:
  serviceName: loki
  replicas: 1
  selector: {matchLabels: {app: loki}}
  template:
    metadata: {labels: {app: loki, tier: observability}}
    spec:
      enableServiceLinks: false
      imagePullSecrets: [{name: cmdb-registry}]
      securityContext: {fsGroup: 10001, runAsUser: 10001, runAsGroup: 10001}
      containers:
      - name: loki
        image: harbor.qa.bcavt.com/cmdb/loki:3.5.0
        args: ["-config.file=/etc/loki/loki.yaml"]
        ports: [{name: http, containerPort: 3100}, {name: grpc, containerPort: 9096}]
        volumeMounts:
        - {name: config, mountPath: /etc/loki}
        - {name: data, mountPath: /loki}
        readinessProbe: {httpGet: {path: /ready, port: 3100}, initialDelaySeconds: 15, periodSeconds: 10, failureThreshold: 12}
        livenessProbe: {httpGet: {path: /ready, port: 3100}, initialDelaySeconds: 45, periodSeconds: 20, failureThreshold: 6}
        resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
      volumes:
      - name: config
        configMap: {name: loki-config}
  volumeClaimTemplates:
  - metadata: {name: data}
    spec: {accessModes: [ReadWriteOnce], storageClassName: longhorn, resources: {requests: {storage: 20Gi}}}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: ops-qa
  labels: {app: loki}
spec:
  selector: {app: loki}
  ports: [{name: http, port: 3100, targetPort: 3100}, {name: grpc, port: 9096, targetPort: 9096}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: alloy-config, namespace: ops-qa}
data:
  config.alloy: |
    logging {
      level  = "info"
      format = "logfmt"
    }

    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_tier"]
        target_label  = "tier"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        target_label  = "job"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "http://loki.ops-qa.svc.cluster.local:3100/loki/api/v1/push"
      }
      external_labels = {cluster = "jzq-cluster"}
    }
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: alloy-logs, namespace: ops-qa}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: cmdb-alloy-logs}
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "namespaces", "nodes", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: cmdb-alloy-logs}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cmdb-alloy-logs}
subjects:
- {kind: ServiceAccount, name: alloy-logs, namespace: ops-qa}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy-logs
  namespace: ops-qa
  labels: {app: alloy-logs, tier: observability}
spec:
  selector: {matchLabels: {app: alloy-logs}}
  template:
    metadata: {labels: {app: alloy-logs, tier: observability}}
    spec:
      serviceAccountName: alloy-logs
      imagePullSecrets: [{name: cmdb-registry}]
      tolerations:
      - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      - {operator: Exists, effect: NoSchedule}
      containers:
      - name: alloy
        image: harbor.qa.bcavt.com/cmdb/alloy:v1.9.2
        args:
        - run
        - /etc/alloy/config.alloy
        - --storage.path=/var/lib/alloy/data
        - --server.http.listen-addr=0.0.0.0:12345
        env:
        - name: HOSTNAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        ports: [{name: http, containerPort: 12345}]
        volumeMounts:
        - {name: config, mountPath: /etc/alloy}
        - {name: data, mountPath: /var/lib/alloy/data}
        readinessProbe: {httpGet: {path: /-/ready, port: 12345}, initialDelaySeconds: 20, periodSeconds: 10, failureThreshold: 12}
        resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
      volumes:
      - name: config
        configMap: {name: alloy-config}
      - name: data
        emptyDir: {}
