# ops-qa 平台工作负载（由 kubectl get 导出后整理，可直接 kubectl apply -f）
# 凭据全部来自 Secret cmdb-gateway-env，本文件不含任何密码。
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: cmdb
    tier: gateway
  name: gateway
  namespace: "ops-qa"
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: "cmdb-gateway"
  strategy:
    rollingUpdate:
      maxSurge: "25%"
      maxUnavailable: "25%"
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: "cmdb-gateway"
        tier: gateway
    spec:
      containers:
        - env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: SSL_CERT_FILE
              value: "/etc/cmdb-tls/ca.crt"
            - name: GOMEMLIMIT
              value: 3500MiB
            - name: GOGC
              value: "75"
            - name: AIOPS_ALLOW_CHANGE_RUNBOOKS
              value: "true"
            - name: AGENT_MTLS_ADDR
              value: ":8443"
            - name: AGENT_MTLS_CERT_FILE
              value: "/etc/cmdb-agent-mtls/tls.crt"
            - name: AGENT_MTLS_KEY_FILE
              value: "/etc/cmdb-agent-mtls/tls.key"
            - name: AGENT_MTLS_CLIENT_CA_FILE
              value: "/etc/cmdb-agent-mtls/ca.crt"
          envFrom:
            - secretRef:
                name: "cmdb-gateway-env"
          image: "harbor.qa.bcavt.com/cmdb/gateway-bff:1.0.232"
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          name: gateway
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 4
            httpGet:
              path: /api/v1/ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            limits:
              cpu: "2"
              memory: 5Gi
            requests:
              cpu: 250m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          terminationMessagePath: "/dev/termination-log"
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: "/etc/cmdb-agent-mtls"
              name: "agent-mtls"
              readOnly: true
            - mountPath: "/etc/cmdb-tls/ca.crt"
              name: "ca-cert"
              readOnly: true
              subPath: ca.crt
            - mountPath: /etc/ssh/ssh_known_hosts
              name: "known-hosts"
              readOnly: true
              subPath: known_hosts
      hostAliases:
        - hostnames:
            - keycloak.jzq.com
          ip: 172.28.69.161
      imagePullSecrets:
        - name: "cmdb-registry"
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccount: "cmdb-k8s-reader"
      serviceAccountName: "cmdb-k8s-reader"
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app: "cmdb-gateway"
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
      volumes:
        - name: "agent-mtls"
          secret:
            defaultMode: 420
            secretName: "cmdb-agent-mtls"
        - configMap:
            defaultMode: 420
            name: "cmdb-known-hosts"
          name: "known-hosts"
        - configMap:
            defaultMode: 420
            name: "cmdb-ca"
          name: "ca-cert"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: cmdb
    tier: web
  name: web
  namespace: "ops-qa"
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: "cmdb-web"
  strategy:
    rollingUpdate:
      maxSurge: "25%"
      maxUnavailable: "25%"
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: "cmdb-web"
        tier: web
    spec:
      containers:
        - env:
            - name: GATEWAY_URL
              value: "http://gateway:8080"
            - name: KEYCLOAK_URL
              value: "https://keycloak.jzq.com:31443"
            - name: KEYCLOAK_REALM
              value: cmdb
            - name: KEYCLOAK_CLIENT_ID
              value: "cmdb-web"
          image: "harbor.qa.bcavt.com/cmdb/web-portal:1.0.180"
          imagePullPolicy: Always
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
          name: web
          ports:
            - containerPort: 8080
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 1
          resources:
            limits:
              cpu: 300m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          terminationMessagePath: "/dev/termination-log"
          terminationMessagePolicy: File
      imagePullSecrets:
        - name: "cmdb-registry"
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: "ops-qa"
spec:
  clusterIP: 10.97.94.83
  clusterIPs:
    - 10.97.94.83
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: http
      nodePort: 30080
      port: 8080
      protocol: TCP
      targetPort: 8080
    - name: "agent-mtls"
      nodePort: 30443
      port: 8443
      protocol: TCP
      targetPort: 8443
  selector:
    app: "cmdb-gateway"
  sessionAffinity: None
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: "ops-qa"
spec:
  clusterIP: 10.109.207.68
  clusterIPs:
    - 10.109.207.68
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app: "cmdb-web"
  sessionAffinity: None
  type: ClusterIP
