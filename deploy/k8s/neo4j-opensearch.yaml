apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: ops-qa
  labels: {app: neo4j, tier: topology}
spec:
  serviceName: neo4j
  replicas: 1
  selector: {matchLabels: {app: neo4j}}
  template:
    metadata:
      labels: {app: neo4j, tier: topology}
    spec:
      # Service environment variables would be parsed as Neo4j settings
      # (for example NEO4J_URL-style names), so they are switched off.
      enableServiceLinks: false
      imagePullSecrets: [{name: cmdb-registry}]
      containers:
      - name: neo4j
        image: harbor.qa.bcavt.com/cmdb/neo4j:5.26-community
        env:
        - {name: NEO4J_AUTH, value: "neo4j/ops_platform_neo4j"}
        - {name: NEO4J_server_memory_heap_initial__size, value: "512m"}
        - {name: NEO4J_server_memory_heap_max__size, value: "1G"}
        - {name: NEO4J_server_memory_pagecache_size, value: "512m"}
        ports: [{name: http, containerPort: 7474}, {name: bolt, containerPort: 7687}]
        volumeMounts:
        - {name: data, mountPath: /data}
        - {name: logs, mountPath: /logs}
        readinessProbe: {httpGet: {path: /, port: 7474}, initialDelaySeconds: 20, periodSeconds: 10, failureThreshold: 12}
        livenessProbe: {httpGet: {path: /, port: 7474}, initialDelaySeconds: 60, periodSeconds: 20, failureThreshold: 6}
        resources: {requests: {cpu: 250m, memory: 1Gi}, limits: {cpu: "2", memory: 3Gi}}
  volumeClaimTemplates:
  - metadata: {name: data}
    spec: {accessModes: [ReadWriteOnce], storageClassName: longhorn, resources: {requests: {storage: 10Gi}}}
  - metadata: {name: logs}
    spec: {accessModes: [ReadWriteOnce], storageClassName: longhorn, resources: {requests: {storage: 2Gi}}}
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: ops-qa
  labels: {app: neo4j}
spec:
  selector: {app: neo4j}
  ports: [{name: http, port: 7474, targetPort: 7474}, {name: bolt, port: 7687, targetPort: 7687}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  namespace: ops-qa
  labels: {app: opensearch, tier: search}
spec:
  serviceName: opensearch
  replicas: 1
  selector: {matchLabels: {app: opensearch}}
  template:
    metadata:
      labels: {app: opensearch, tier: search}
    spec:
      enableServiceLinks: false
      imagePullSecrets: [{name: cmdb-registry}]
      # The Longhorn volume is created root-owned, so the container runs as the
      # uid/gid that ships with the OpenSearch image.
      securityContext: {fsGroup: 1000, runAsUser: 1000, runAsGroup: 1000}
      containers:
      - name: opensearch
        image: harbor.qa.bcavt.com/cmdb/opensearch:2.19.1
        env:
        - {name: discovery.type, value: single-node}
        - {name: DISABLE_SECURITY_PLUGIN, value: "true"}
        - {name: bootstrap.memory_lock, value: "true"}
        - {name: OPENSEARCH_JAVA_OPTS, value: "-Xms512m -Xmx512m"}
        ports: [{name: http, containerPort: 9200}, {name: transport, containerPort: 9300}]
        volumeMounts: [{name: data, mountPath: /usr/share/opensearch/data}]
        readinessProbe: {httpGet: {path: /_cluster/health, port: 9200}, initialDelaySeconds: 20, periodSeconds: 10, failureThreshold: 12}
        livenessProbe: {httpGet: {path: /_cluster/health, port: 9200}, initialDelaySeconds: 60, periodSeconds: 20, failureThreshold: 6}
        resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: "2", memory: 3Gi}}
        securityContext: {capabilities: {add: [IPC_LOCK]}}
  volumeClaimTemplates:
  - metadata: {name: data}
    spec: {accessModes: [ReadWriteOnce], storageClassName: longhorn, resources: {requests: {storage: 20Gi}}}
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: ops-qa
  labels: {app: opensearch}
spec:
  selector: {app: opensearch}
  ports: [{name: http, port: 9200, targetPort: 9200}, {name: transport, port: 9300, targetPort: 9300}]
