name: ${COMPOSE_PROJECT_NAME:-cmdb-app}

services:
  gateway:
    build:
      context: ../apps/gateway-bff
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    image: cmdb/gateway:${CMDB_VERSION:-latest}
    container_name: cmdb-gateway
    env_file:
      - ./secrets/gateway.env
    environment:
      HTTP_ADDR: ":8080"
      AUTH_CACHE_TTL: ${AUTH_CACHE_TTL:-60s}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${GATEWAY_PORT:-8080}:8080"
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "/gateway", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M
    networks: [app]

  web:
    build:
      context: ../apps/web-portal
    image: cmdb/web:${CMDB_VERSION:-latest}
    container_name: cmdb-web
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8088}:8080"
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx", "/var/run"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [app]

networks:
  app:
    name: cmdb-app
