global:
  resolve_timeout: 5m
route:
  receiver: cmdb-webhook
  group_by: [alertname, cluster, service]
  group_wait: 15s
  group_interval: 1m
  repeat_interval: 4h
receivers:
  - name: cmdb-webhook
    webhook_configs:
      - url: http://gateway.ops-qa.svc.cluster.local:8080/api/v1/monitor/alerts/webhook
        send_resolved: true
        max_alerts: 0
inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, instance]
