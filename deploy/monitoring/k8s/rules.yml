groups:
  - name: cmdb-platform
    rules:
      - alert: CMDBTargetDown
        expr: up{job=~"cmdb-gateway|prometheus|alertmanager"} == 0
        for: 2m
        labels: {severity: critical, category: availability}
        annotations:
          summary: "监控组件不可用"
          description: "{{ $labels.job }} 目标 {{ $labels.instance }} 已不可用超过 2 分钟。"
      - alert: CMDBHostDown
        expr: up{job="cmdb-node-exporter"} == 0
        for: 2m
        labels: {severity: critical, category: availability}
        annotations:
          summary: "CMDB 纳管主机不可用"
          description: "资产 {{ $labels.cmdb_asset_id }}（{{ $labels.instance }}）已不可用超过 2 分钟。"
      - alert: HostCPUHigh
        expr: 100 - avg by(instance,cmdb_asset_id,asset_name,environment,project_group) (rate(node_cpu_seconds_total{job="cmdb-node-exporter",mode="idle"}[5m])) * 100 > 85
        for: 10m
        labels: {severity: warning, category: capacity}
        annotations:
          summary: "主机 CPU 使用率过高"
          description: "主机 {{ $labels.instance }} CPU 已超过 85% 持续 10 分钟。"
      - alert: HostMemoryHigh
        expr: (1 - node_memory_MemAvailable_bytes{job="cmdb-node-exporter"} / node_memory_MemTotal_bytes{job="cmdb-node-exporter"}) * 100 > 90
        for: 10m
        labels: {severity: critical, category: capacity}
        annotations:
          summary: "主机内存使用率过高"
          description: "主机 {{ $labels.instance }} 内存已超过 90% 持续 10 分钟。"
      - alert: HostDiskSpaceLow
        expr: (1 - node_filesystem_avail_bytes{job="cmdb-node-exporter",mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{job="cmdb-node-exporter",mountpoint="/",fstype!~"tmpfs|overlay"}) * 100 > 85
        for: 15m
        labels: {severity: warning, category: capacity}
        annotations:
          summary: "主机磁盘空间不足"
          description: "主机 {{ $labels.instance }} 根分区使用率已超过 85%。"
      - alert: CMDBDeviceDown
        expr: up{job="cmdb-snmp"} == 0
        for: 2m
        labels: {severity: critical, category: availability}
        annotations:
          summary: "CMDB 纳管网络设备不可用"
          description: "设备 {{ $labels.asset_name }}（{{ $labels.instance }}）已不可用超过 2 分钟。"
      - alert: NetworkInterfaceDown
        expr: ifOperStatus{job="cmdb-snmp"} == 2 and on(instance, ifIndex) (ifAdminStatus{job="cmdb-snmp"} == 1)
        for: 5m
        labels: {severity: warning, category: availability}
        annotations:
          summary: "网络设备接口 Down"
          description: "设备 {{ $labels.asset_name }} 接口 {{ $labels.ifName }} 已 Down 超过 5 分钟。"
      - alert: PostgreSQLDown
        expr: up{job="postgresql"} == 0
        for: 2m
        labels: {severity: critical, category: availability}
        annotations:
          summary: "PostgreSQL 监控目标不可用"
          description: "PostgreSQL 主节点指标目标 {{ $labels.instance }} 已不可用超过 2 分钟。"
      - alert: PostgreSQLConnectionsHigh
        expr: sum(cnpg_backends_total) > 500
        for: 10m
        labels: {severity: warning, category: capacity}
        annotations:
          summary: "PostgreSQL 连接数过高"
          description: "PostgreSQL 当前连接数 {{ $value }}，已超过 500。"
      - alert: PostgreSQLReplicationLagHigh
        expr: max(cnpg_pg_replication_lag) > 30
        for: 5m
        labels: {severity: critical, category: availability}
        annotations:
          summary: "PostgreSQL 复制延迟过高"
          description: "PostgreSQL 最大复制延迟为 {{ $value }} 秒，已超过 30 秒。"
      - alert: PostgreSQLArchiverFailing
        expr: max(increase(cnpg_pg_stat_archiver_failed_count[10m])) > 0
        for: 10m
        labels: {severity: warning, category: availability}
        annotations:
          summary: "PostgreSQL WAL 归档失败"
          description: "PostgreSQL 最近 10 分钟出现 WAL 归档失败。"
      - alert: KeycloakDown
        expr: up{job="keycloak"} == 0
        for: 2m
        labels: {severity: critical, category: availability}
        annotations:
          summary: "Keycloak 监控目标不可用"
          description: "Keycloak 指标目标 {{ $labels.instance }} 已不可用超过 2 分钟。"
      - alert: KeycloakHeapMemoryHigh
        expr: base_memory_usedHeap_bytes{job="keycloak"} / clamp_min(base_memory_maxHeap_bytes{job="keycloak"}, 1) * 100 > 90
        for: 10m
        labels: {severity: warning, category: capacity}
        annotations:
          summary: "Keycloak JVM 堆内存过高"
          description: "Keycloak 实例 {{ $labels.instance }} 堆内存使用率已超过 90%。"
      - alert: CMDBEventOutboxBacklog
        expr: max(cmdb_event_outbox_pending{job="cmdb-gateway"}) > 100
        for: 5m
        labels: {severity: warning, category: event-bus}
        annotations:
          summary: "CMDB 事件 Outbox 积压"
          description: "事件总线待发布数量为 {{ $value }}，已超过 100 条持续 5 分钟。"
      - alert: CMDBEventOutboxRetrying
        expr: max(cmdb_event_outbox_retrying{job="cmdb-gateway"}) > 0
        for: 5m
        labels: {severity: warning, category: event-bus}
        annotations:
          summary: "CMDB 事件 Outbox 持续重试"
          description: "事件总线存在失败重试事件，已持续 5 分钟，请检查 Kafka 与数据库连接。"
      - alert: CMDBEventOutboxStalled
        expr: max(cmdb_event_outbox_pending{job="cmdb-gateway"}) > 0 and time() - max(cmdb_event_outbox_last_publish_timestamp_seconds{job="cmdb-gateway"}) > 900
        for: 5m
        labels: {severity: critical, category: event-bus}
        annotations:
          summary: "CMDB 事件 Outbox 发布停滞"
          description: "存在待发布事件且最近 15 分钟没有成功发布记录。"
      - alert: CMDBAssetEventConsumerDown
        expr: min(cmdb_asset_event_consumer_up{job="cmdb-gateway"}) < 1
        for: 2m
        labels: {severity: critical, category: event-bus}
        annotations:
          summary: "CMDB 资产事件消费者未运行"
          description: "至少一个 Gateway 副本未运行资产事件消费者，跨副本 CMDB 刷新可能失效。"
      - alert: CMDBNotificationDeadLetter
        expr: max(cmdb_notification_dead_letters_total{job="cmdb-gateway"}) > 0
        for: 1m
        labels: {severity: warning, category: notification}
        annotations:
          summary: "CMDB 通知存在死信"
          description: "通知死信队列中有 {{ $value }} 条消息，请进入监控告警页面处理。"
      - alert: PlatformDependencyDown
        expr: cmdb_dependency_up{job="cmdb-gateway"} == 0
        for: 2m
        labels: {severity: critical, category: availability}
        annotations:
          summary: "平台依赖不可用"
          description: "依赖服务 {{ $labels.name }} 已不可用超过 2 分钟。"