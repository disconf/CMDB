name: ${COMPOSE_PROJECT_NAME:-cmdb}

x-common: &common
  restart: unless-stopped
  networks: [cmdb]
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    <<: *common
    build:
      context: ../core/postgres
    image: cmdb/postgres:17.10
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_ADMIN_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
      PLATFORM_DB_NAME: ${PLATFORM_DB_NAME}
      PLATFORM_DB_USER: ${PLATFORM_DB_USER}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - ${CMDB_DATA_DIR:-/opt/cmdb}/postgres:/var/lib/postgresql/data
    shm_size: 512mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    <<: *common
    build:
      context: ../core/redis
    image: cmdb/redis:8.2
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ${CMDB_DATA_DIR:-/opt/cmdb}/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH='$${REDIS_PASSWORD}' redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka:
    <<: *common
    build:
      context: ../core/kafka
    image: cmdb/kafka:4.3.1
    environment:
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://${SERVER_HOST}:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-3}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - ${CMDB_DATA_DIR:-/opt/cmdb}/kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s

  kafka-init:
    image: cmdb/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - |
        for topic in \
          cmdb.asset.changed.v1 \
          cmdb.relation.changed.v1 \
          discovery.resource.found.v1 \
          monitor.target.changed.v1 \
          alert.state.changed.v1 \
          job.execution.changed.v1 \
          ticket.state.changed.v1 \
          release.state.changed.v1 \
          audit.operation.created.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
            --create --if-not-exists --topic "$$topic" \
            --partitions ${KAFKA_NUM_PARTITIONS:-3} --replication-factor 1
        done
    networks: [cmdb]
    restart: "no"

  keycloak:
    <<: *common
    build:
      context: ../core/keycloak
    image: cmdb/keycloak:26.7.0
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - start
      - --optimized
      - --http-enabled=true
      - --hostname-strict=false
      - --proxy-headers=xforwarded
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${KEYCLOAK_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep '200'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  vault:
    <<: *common
    image: hashicorp/vault:2.0.4
    cap_add: [IPC_LOCK]
    command: ["server", "-config=/vault/config/vault.hcl"]
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - ${CMDB_DATA_DIR:-/opt/cmdb}/vault:/vault/data
      - ./config/vault/vault.hcl:/vault/config/vault.hcl:ro
    ports:
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:8200:8200"
    healthcheck:
      test: ["CMD-SHELL", "vault status >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    <<: *common
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ${CMDB_DATA_DIR:-/opt/cmdb}/minio:/data
    ports:
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:9000:9000"
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-41-24Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${S3_BUCKET}"
    networks: [cmdb]
    restart: "no"

  neo4j:
    <<: *common
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-1G}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-1G}
    volumes:
      - ${CMDB_DATA_DIR:-/opt/cmdb}/neo4j/data:/data
      - ${CMDB_DATA_DIR:-/opt/cmdb}/neo4j/logs:/logs
    ports:
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:7474:7474"
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474/ >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  opensearch:
    <<: *common
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ${CMDB_DATA_DIR:-/opt/cmdb}/opensearch:/usr/share/opensearch/data
    ports:
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 40s

  prometheus:
    <<: *common
    image: prom/prometheus:v3.13.4
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-lifecycle
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - ./secrets/agent-token:/etc/prometheus/token/agent-token:ro
      - ${CMDB_DATA_DIR:-/opt/cmdb}/prometheus:/prometheus
    ports:
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:9090:9090"

  alertmanager:
    <<: *common
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${CMDB_DATA_DIR:-/opt/cmdb}/alertmanager:/alertmanager
    ports:
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:9093:9093"

  grafana:
    <<: *common
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ${CMDB_DATA_DIR:-/opt/cmdb}/grafana:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/k8s/grafana-host-dashboard.json:/var/lib/grafana/dashboards/grafana-host-dashboard.json:ro
      - ../monitoring/k8s/grafana-network-dashboard.json:/var/lib/grafana/dashboards/grafana-network-dashboard.json:ro
    ports:
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:3000:3000"

  loki:
    <<: *common
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/config.yml:ro
      - ${CMDB_DATA_DIR:-/opt/cmdb}/loki:/loki
    ports:
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:3100:3100"

  tempo:
    <<: *common
    image: grafana/tempo:2.8.1
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./config/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - ${CMDB_DATA_DIR:-/opt/cmdb}/tempo:/var/tempo
    ports:
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:3200:3200"
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:4317:4317"
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:4318:4318"

  node-exporter:
    <<: *common
    image: prom/node-exporter:v1.9.1
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:9100:9100"

  postgres-exporter:
    <<: *common
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://${PLATFORM_DB_USER}:${PLATFORM_DB_PASSWORD}@postgres:5432/${PLATFORM_DB_NAME}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    <<: *common
    image: oliver006/redis_exporter:v1.66.0
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy

  snmp-exporter:
    <<: *common
    image: prom/snmp-exporter:v0.30.1
    ports:
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:9116:9116"

  ansible-runner:
    <<: *common
    build:
      context: ../../apps/ansible-runner-service
    image: cmdb/ansible-runner-service:${CMDB_VERSION:-1.0.5}
    env_file:
      - ./secrets/runner.env
    environment:
      SSH_PRIVATE_KEY_PATH: /run/secrets/runner_id_ed25519
      KNOWN_HOSTS_PATH: /run/secrets/runner_known_hosts
    depends_on:
      gateway:
        condition: service_healthy
    secrets:
      - source: runner_ssh_private_key
        target: runner_id_ed25519
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: runner_known_hosts
        target: runner_known_hosts
        uid: "10001"
        gid: "10001"
        mode: 0444
    ports:
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:8090:8090"
    read_only: true
    tmpfs:
      - /tmp/cmdb-runner:uid=10001,gid=10001,mode=0700

  gateway:
    <<: *common
    build:
      context: ../../apps/gateway-bff
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    image: cmdb/gateway:${CMDB_VERSION:-1.0.230}
    env_file:
      - ./secrets/gateway.env
    environment:
      HTTP_ADDR: ":8080"
      AUTH_CACHE_TTL: ${AUTH_CACHE_TTL:-60s}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${GATEWAY_PORT:-8080}:8080"
    read_only: true
    tmpfs: ["/tmp"]
    healthcheck:
      test: ["CMD", "/gateway", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s

  web:
    <<: *common
    build:
      context: ../../apps/web-portal
    image: cmdb/web:${CMDB_VERSION:-1.0.180}
    environment:
      GATEWAY_URL: http://gateway:8080
      KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL}
      KEYCLOAK_REALM: cmdb
      KEYCLOAK_CLIENT_ID: cmdb-web
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8088}:8080"
    read_only: true
    tmpfs: ["/tmp"]

networks:
  cmdb:
    name: ${COMPOSE_PROJECT_NAME:-cmdb}

secrets:
  runner_ssh_private_key:
    file: ${RUNNER_SSH_KEY_FILE:-./secrets/runner_id_ed25519}
  runner_known_hosts:
    file: ${RUNNER_KNOWN_HOSTS_FILE:-./secrets/runner_known_hosts}
