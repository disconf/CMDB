global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: single-node
    cluster: cmdb-single-node

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels: {service: prometheus}

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels: {service: alertmanager}

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: {service: cmdb-host}

  - job_name: postgresql
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels: {service: postgresql}

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels: {service: redis}

  - job_name: cmdb-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]
        labels: {service: gateway-bff}

  - job_name: cmdb-node-exporter
    http_sd_configs:
      - url: http://gateway:8080/api/v1/monitor/service-discovery/node-exporter
        refresh_interval: 30s
        bearer_token_file: /etc/prometheus/token/agent-token
    relabel_configs:
      - source_labels: [asset_id]
        target_label: cmdb_asset_id
      - source_labels: [asset_name]
        target_label: instance

  - job_name: cmdb-exporter
    http_sd_configs:
      - url: http://gateway:8080/api/v1/monitor/service-discovery/exporters
        refresh_interval: 30s
        bearer_token_file: /etc/prometheus/token/agent-token
    relabel_configs:
      - source_labels: [asset_id]
        target_label: cmdb_asset_id
      - source_labels: [asset_name]
        target_label: instance
      - source_labels: [asset_type]
        target_label: asset_type
      - source_labels: [exporter]
        target_label: exporter

  - job_name: cmdb-cicd-linked
    http_sd_configs:
      - url: http://gateway:8080/api/v1/monitor/service-discovery/cicd
        refresh_interval: 30s
        bearer_token_file: /etc/prometheus/token/agent-token
    relabel_configs:
      - source_labels: [asset_id]
        target_label: cmdb_asset_id
      - source_labels: [asset_name]
        target_label: instance
      - source_labels: [asset_type]
        target_label: asset_type
      - source_labels: [exporter]
        target_label: exporter
      - source_labels: [cicd_resource_type]
        target_label: cicd_resource_type
      - source_labels: [cicd_resource_id]
        target_label: cicd_resource_id
      - source_labels: [cicd_relation]
        target_label: cicd_relation
