services:
  node-exporter:
    image: prom/node-exporter:v1.11.1
    container_name: cmdb-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --web.listen-address=:${NODE_EXPORTER_PORT:-9100}
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
